[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/mietrendite-rechner"
  to   = "/mietrendite-rechner.html"
  status = 200

[[redirects]]
  from = "/afa-rechner"
  to   = "/afa-rechner.html"
  status = 200

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
