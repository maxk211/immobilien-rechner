name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'   # nur wenn sich Supabase-Dateien ändern

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Migration ausführen
      - name: DB Push (Migrations)
        run: supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Edge Function Secrets setzen (nur wenn vorhanden)
      - name: Secrets setzen
        run: |
          supabase secrets set \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Edge Functions deployen
      - name: Edge Functions deployen
        run: |
          supabase functions deploy create-checkout --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy stripe-webhook   --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
