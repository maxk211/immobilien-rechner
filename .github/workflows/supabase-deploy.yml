name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'   # nur wenn sich Supabase-Dateien ändern
  workflow_dispatch:     # manuell triggerbar

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Projekt verknüpfen
      - name: Supabase Link
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Migration ausführen
      - name: DB Push (Migrations)
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Edge Function Secrets setzen
      # SMTP_* Secrets müssen einmalig als GitHub-Repo-Secrets angelegt werden
      # (Settings → Secrets and variables → Actions), sonst bleiben sie leer
      # und trial-reminder-emails verschickt keine Mails (loggt das nur, kein Crash).
      - name: Secrets setzen
        run: |
          supabase secrets set \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            SMTP_HOST="${{ secrets.SMTP_HOST }}" \
            SMTP_PORT="${{ secrets.SMTP_PORT }}" \
            SMTP_USER="${{ secrets.SMTP_USER }}" \
            SMTP_PASS="${{ secrets.SMTP_PASS }}" \
            SMTP_FROM="${{ secrets.SMTP_FROM }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Edge Functions deployen
      - name: Edge Functions deployen
        run: |
          supabase functions deploy create-checkout
          supabase functions deploy create-checkout-anon --no-verify-jwt
          supabase functions deploy stripe-webhook
          supabase functions deploy trial-reminder-emails
          supabase functions deploy new-user-notification
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
