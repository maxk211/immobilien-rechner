<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seite nicht gefunden | renditly</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        color: #fff;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 900;
        font-size: 20px;
        letter-spacing: -0.02em;
        margin-bottom: 40px;
      }
      .logo-badge {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      }
      h1 {
        font-size: 72px;
        font-weight: 900;
        margin: 0 0 8px;
        background: linear-gradient(135deg, #6366f1 0%, #34d399 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        color: #94a3b8;
        font-size: 17px;
        max-width: 420px;
        line-height: 1.6;
        margin: 0 0 32px;
      }
      a.btn {
        display: inline-block;
        padding: 12px 28px;
        background: #6366f1;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 15px;
        border-radius: 14px;
      }
      a.btn:hover { background: #4f46e5; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo"><span class="logo-badge"></span>renditly</div>
      <h1>404</h1>
      <p>Diese Seite gibt es nicht (mehr). Vielleicht wurde der Link falsch getippt oder die Seite verschoben.</p>
      <a class="btn" href="/">Zur Startseite</a>
    </div>
  </body>
</html>
