    <script type="application/ld+json">

      "@context": "https://schema.org",
      "@type": "Article",
      "headline": "AfA und Steuern bei Vermietung: Der Leitfaden für Vermieter",
      "description": "Wie die Abschreibung für Abnutzung funktioniert, welche Werbungskosten absetzbar sind und worauf es bei der Steuererklärung für Vermieter ankommt.",
      "articleBody": "Warum Steuern bei der Immobilienrendite mitentscheiden\nViele Investoren berechnen Mietrendite und Cashflow, vergessen dabei aber den steuerlichen Effekt der AfA (Absetzung für Abnutzung), die das zu versteuernde Einkommen senkt, ohne dass tatsächlich Geld das Konto verlässt.\n\nWas ist die AfA?\nDie AfA bildet steuerlich ab, dass ein Gebäude über die Jahre an Wert verliert. Formel: Jährliche AfA = Gebäudewert (Kaufpreis + Nebenkosten − Grundstücksanteil) × AfA-Satz. Nur der Gebäudeanteil ist abschreibbar, nicht der Grundstücksanteil — üblich sind 15 bis 30 % des Kaufpreises, in Ballungsräumen auch höher.\n\nDer AfA-Satz nach Baujahr\nGesetzlich (§ 7 Abs. 4 EStG): 3 % pro Jahr für Neubauten mit Fertigstellung ab 2023 (ca. 33 Jahre), 2 % pro Jahr für Gebäude mit Baujahr ab 1925 (50 Jahre), 2,5 % pro Jahr für Altbauten vor 1925 (40 Jahre). Beispiel: Wohnung Baujahr 2010, 300.000 € zzgl. 10 % Kaufnebenkosten (330.000 € Gesamtkosten), Grundstücksanteil 20 %, Gebäudeanteil 264.000 €, bei 2 % AfA jährlich 5.280 €.\n\nSonder-AfA § 7b EStG für Neubau-Mietwohnungen\nFür neu gebaute Mietwohnungen mit Bauantrag ab 2023 gibt es zusätzlich zur linearen AfA eine Sonder-AfA von 5 % pro Jahr über die ersten vier Jahre, bei max. 5.200 €/m² Baukosten und mindestens Effizienzhaus 55. In den ersten vier Jahren summiert sich die Abschreibung auf 3 % + 5 % = 8 % pro Jahr.\n\nWelche Werbungskosten kann ich als Vermieter absetzen?\nSchuldzinsen (nur der Zinsanteil), Erhaltungsaufwand (sofort in voller Höhe absetzbar), Verwaltungskosten, Fahrtkosten, Hausgeld-Anteile. Erhaltungsaufwand vs. Herstellungskosten: Erhaltungsaufwand ist sofort absetzbar, Herstellungskosten müssen über die AfA verteilt abgeschrieben werden.\n\nSteuerersparnis durch AfA berechnen\nFormel: Steuerersparnis pro Jahr = jährliche AfA × persönlicher Grenzsteuersatz. Beispiel: 5.280 € AfA bei 42 % Grenzsteuersatz ergibt 2.218 € Steuerersparnis pro Jahr.\n\nDenkmal-AfA\nFür Sanierungskosten an Baudenkmälern gelten §§ 7i und 7h EStG: Abschreibung über 12 Jahre mit bis zu 9 % pro Jahr in den ersten acht Jahren und 7 % in den folgenden vier Jahren, mit Bescheinigung der Denkmalschutzbehörde.\n\nHäufige Fehler bei der AfA\nGrundstücksanteil zu niedrig angesetzt, Einbauküche und Mobiliar fälschlich in die Gebäude-AfA eingerechnet (eigene, kürzere Nutzungsdauer, z. B. 10 Jahre), AfA bei Eigennutzung geltend gemacht (steht nur für vermietete Immobilien zu).\n\nWas passiert mit der AfA beim Verkauf?\nBeim Verkauf innerhalb von zehn Jahren greift unter Umständen die Spekulationssteuer (§ 23 EStG) — die in der Vergangenheit geltend gemachte AfA erhöht den zu versteuernden Veräußerungsgewinn.\n\nFazit\nDie AfA ist einer der am meisten unterschätzten Hebel bei der Immobilienrendite.",

          "name": "Was ist die AfA bei Vermietung?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Die AfA (Absetzung für Abnutzung) erlaubt Vermietern, jedes Jahr einen festen Prozentsatz des Gebäudewerts steuerlich von den Mieteinnahmen abzuziehen. Formel: Gebäudewert × AfA-Satz."
          }
        },
        {
          "@type": "Question",
          "name": "Welche Werbungskosten kann ich als Vermieter absetzen?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absetzbar sind unter anderem Schuldzinsen (nicht die Tilgung), Erhaltungsaufwand, Verwaltungskosten, Fahrtkosten zur Immobilie und der nicht umlagefähige Anteil des Hausgelds."
          }
        },
        {
          "@type": "Question",
          "name": "Was ist der Unterschied zwischen Erhaltungsaufwand und Herstellungskosten?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Erhaltungsaufwand (z. B. Austausch einer defekten Heizung) ist sofort in voller Höhe absetzbar. Herstellungskosten (z. B. eine grundlegende Modernisierung, die den Standard deutlich anhebt) müssen über die AfA verteilt abgeschrieben werden."
          }
        },
        {
          "@type": "Question",
          "name": "Wie berechne ich die Steuerersparnis durch die AfA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Steuerersparnis pro Jahr = jährliche AfA × persönlicher Grenzsteuersatz. Bei 5.280 € AfA und 42 % Steuersatz ergeben sich zum Beispiel 2.218 € Steuerersparnis pro Jahr."
          }
        },
        {
          "@type": "Question",
          "name": "Was ist die Denkmal-AfA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Bei Baudenkmälern oder Gebäuden in Sanierungsgebieten können Sanierungskosten nach §§ 7i/7h EStG über 12 Jahre abgeschrieben werden — 9 % pro Jahr in den ersten acht Jahren, 7 % in den folgenden vier Jahren. Voraussetzung ist eine Bescheinigung der Denkmalschutzbehörde."
          }
        },

          "@type": "Question",
          "name": "Was passiert mit der AfA beim Verkauf der Immobilie?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Beim Verkauf innerhalb von zehn Jahren nach dem Kauf kann die Spekulationssteuer greifen. Die in der Vergangenheit geltend gemachte AfA senkt den Buchwert und erhöht dadurch den steuerpflichtigen Veräußerungsgewinn."
          }
        }
