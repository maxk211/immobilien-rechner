          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Bruttomietrendite (%) = (Kaltmiete pro Monat × 12) / Kaufpreis × 100. Sie berücksichtigt weder Kaufnebenkosten noch laufende Kosten."

        },
        {
          "@type": "Question",
          "name": "Wie berechnet man die Nettomietrendite?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nettomietrendite (%) = ((Kaltmiete − laufende Kosten) × 12) / (Kaufpreis + Kaufnebenkosten) × 100. Sie ist realistischer als die Bruttomietrendite, da sie Kosten berücksichtigt."
          }
        },
        {
          "@type": "Question",
          "name": "Was ist eine gute Mietrendite in Deutschland?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Eine Nettomietrendite ab 4 % gilt als rentabel, 2–4 % ist Durchschnitt in vielen deutschen Großstädten, unter 2 % ist in Toplagen wie München oder Hamburg keine Seltenheit."
          }
        },
        {
          "@type": "Question",
          "name": "Was ist die Cash-on-Cash-Rendite?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Die Cash-on-Cash-Rendite misst den jährlichen Cashflow im Verhältnis zum eingesetzten Eigenkapital: (Jahres-Cashflow / Eigenkapital) × 100. Sie zeigt, wie effizient das eingesetzte Kapital durch die Fremdfinanzierung arbeitet."
          }
        }
