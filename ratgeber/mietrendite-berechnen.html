      "articleBody": "Warum die Mietrendite die wichtigste Kennzahl für Vermieter ist\nDie Mietrendite zeigt, wie profitabel eine Immobilie im Verhältnis zu ihrem Kaufpreis ist. Sie ist die zentrale Kennzahl, um verschiedene Objekte objektiv zu vergleichen. Es gibt nicht die eine Mietrendite, sondern mehrere Kennzahlen: Bruttomietrendite, Nettomietrendite und Cash-on-Cash-Rendite.\n\nBruttomietrendite: Die schnelle erste Einschätzung\nDie Bruttomietrendite setzt die jährliche Kaltmiete ins Verhältnis zum Kaufpreis — ohne Kaufnebenkosten, Finanzierung oder laufende Kosten zu berücksichtigen. Formel: Bruttomietrendite (%) = (Kaltmiete pro Monat × 12) / Kaufpreis × 100. Beispiel: Eine Wohnung kostet 300.000 €, die Kaltmiete beträgt 900 € im Monat. Die Bruttomietrendite liegt dann bei (900 × 12) / 300.000 × 100 = 3,6 %.\n\nNettomietrendite: Die realistischere Kennzahl\nDie Nettomietrendite berücksichtigt zusätzlich die Kaufnebenkosten (Grunderwerbsteuer, Notar, Makler) sowie laufende, nicht umlagefähige Kosten. Formel: Nettomietrendite (%) = ((Kaltmiete − laufende Kosten) × 12) / (Kaufpreis + Kaufnebenkosten) × 100. Beispiel: Gleiche Wohnung für 300.000 €, Kaufnebenkosten 10 % (30.000 €), laufende Kosten 150 € im Monat: ((900 − 150) × 12) / 330.000 × 100 = 2,7 %.\n\nWas ist eine gute Mietrendite?\nAb 4 % netto gilt als rentabel, häufig in B- und C-Lagen erreichbar. 2–4 % netto ist Durchschnitt in vielen deutschen Großstädten. Unter 2 % netto ist in Toplagen wie München oder Hamburg keine Seltenheit — hier steht meist die Wertsteigerung im Vordergrund.\n\nCash-on-Cash-Rendite: Die Rendite auf das eingesetzte Kapital\nFormel: Cash-on-Cash-Rendite (%) = (Jahres-Cashflow / eingesetztes Eigenkapital) × 100. Sie zeigt, wie effizient der Leverage-Effekt der Fremdfinanzierung wirkt.\n\nMietrendite vs. Gesamtrendite\nDie Mietrendite betrachtet nur den laufenden Ertrag. Tilgung erhöht als erzwungenes Sparen das Eigenkapital des Vermieters unabhängig vom Cashflow. Wertsteigerung ist historisch in deutschen Groß- und Mittelstädten über lange Zeiträume aufgetreten, wenn auch nicht garantiert. Näherungsformel: Gesamtrendite ≈ Nettomietrendite + jährliche Tilgungsquote + erwartete Wertsteigerung p. a.\n\nHäufige Rechenfehler bei der Mietrendite\nWarmmiete statt Kaltmiete verwenden ist falsch — nur die Kaltmiete gehört in die Formel. Kaufnebenkosten dürfen bei der finalen Kaufentscheidung nicht ignoriert werden, auch wenn die Bruttomietrendite sie bewusst ausklammert. Sanierungsstau sollte wie ein zusätzlicher Kaufpreisbestandteil behandelt werden.\n\nFazit\nDie Bruttomietrendite eignet sich für die schnelle Vorauswahl, die Nettomietrendite für die realistische Einschätzung und die Cash-on-Cash-Rendite für die Bewertung der Finanzierungsstrategie.",
