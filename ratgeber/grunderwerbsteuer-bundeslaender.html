      "description": "Die Grunderwerbsteuer liegt je nach Bundesland zwischen 3,5 % und 6,5 % des Kaufpreises — mit einer Übersicht aller 16 Bundesländer.",
      "articleBody": "Was ist die Grunderwerbsteuer?\nDie Grunderwerbsteuer fällt beim Kauf eines Grundstücks oder einer Immobilie in Deutschland an und wird auf den vollständigen Kaufpreis berechnet. Sie ist Teil der Kaufnebenkosten und damit ein direkter Faktor für die Nettomietrendite.\n\nGrunderwerbsteuer nach Bundesland: Die Übersicht\nSeit der Föderalismusreform 2006 legen die Bundesländer den Steuersatz selbst fest. Die Sätze reichen aktuell von 3,5 % bis 6,5 % — bei einem Kaufpreis von 500.000 € entspricht das einer Differenz von 15.000 € allein durch den Standort.\nGrunderwerbsteuersätze aller 16 Bundesländer (Stand August 2026): Baden-Württemberg 5,0 %, Bayern 3,5 %, Berlin 6,0 %, Brandenburg 6,5 %, Bremen 5,5 %, Hamburg 5,5 %, Hessen 6,0 %, Mecklenburg-Vorpommern 6,0 %, Niedersachsen 5,0 %, Nordrhein-Westfalen 6,5 %, Rheinland-Pfalz 5,0 %, Saarland 6,5 %, Sachsen 5,5 %, Sachsen-Anhalt 5,0 %, Schleswig-Holstein 6,5 %, Thüringen 5,0 %.\nSteuersätze können sich per Landesgesetz ändern (zuletzt z. B. Bremen zum 1. Juli 2025 von 5,0 % auf 5,5 % erhöht, Thüringen zum 1. Januar 2024 von 6,5 % auf 5,0 % gesenkt).\n\nWer zahlt die Grunderwerbsteuer?\nGesetzlich schulden Käufer und Verkäufer die Grunderwerbsteuer gemeinsam (§ 13 GrEStG) — in der Praxis wird im Kaufvertrag aber so gut wie immer vereinbart, dass der Käufer die Steuer allein trägt.\n\nWann ist die Grunderwerbsteuer fällig?\nNach notarieller Beurkundung meldet der Notar den Kauf automatisch dem zuständigen Finanzamt, das den Steuerbescheid meist vier bis acht Wochen nach Beurkundung versendet. Die Zahlungsfrist beträgt in der Regel einen Monat nach Zugang des Bescheids. Erst nach vollständiger Zahlung stellt das Finanzamt die Unbedenklichkeitsbescheinigung aus, ohne die keine Grundbuchumschreibung erfolgt.\n\nGrunderwerbsteuer sparen: Legale Gestaltungsmöglichkeiten\nBewegliche Gegenstände wie Einbauküche oder Markise unterliegen nicht der Grunderwerbsteuer, wenn sie im Kaufvertrag separat und mit realistischem Wert ausgewiesen werden. Bei größeren gewerblichen Transaktionen wird die Steuer teils durch Share Deals umgangen — für private Kapitalanleger in der Regel nicht relevant.\n\nGrunderwerbsteuer in der Renditerechnung\nFür die Nettomietrendite zählt die Grunderwerbsteuer zu den Kaufnebenkosten neben Notar- und Maklerkosten — zusammen liegen diese Nebenkosten je nach Bundesland häufig bei 8 bis 15 % des Kaufpreises.\n\nFazit\nDie Grunderwerbsteuer unterscheidet sich je nach Bundesland um bis zu drei Prozentpunkte und sollte bei jedem Immobilienkauf von Anfang an in die Kalkulation einfließen.",
