      "description": "Eigenbedarf ist der häufigste Kündigungsgrund im Mietrecht — Voraussetzungen, Kündigungsfristen, Sperrfrist bei umgewandelten Eigentumswohnungen und das Risiko bei vorgetäuschtem Eigenbedarf.",
      "articleBody": "Was bedeutet Eigenbedarf rechtlich?\nNach § 573 Abs. 2 Nr. 2 BGB darf ein Vermieter kündigen, wenn er die Wohnung für sich selbst, einen Familienangehörigen oder einen Angehörigen seines Haushalts als Wohnraum benötigt. Der Bedarf muss ernsthaft, konkret und nachvollziehbar sein. Zulässige Bedarfspersonen sind neben dem Vermieter selbst u. a. Kinder, Enkel, Eltern, Geschwister sowie in bestimmten Fällen Nichten, Neffen oder Haushaltsangehörige.\n\nFormale Anforderungen an das Kündigungsschreiben\nDie Kündigung muss schriftlich erfolgen und konkret begründet werden: Name und Verwandtschaftsverhältnis der Bedarfsperson, konkreter Grund, Hinweis auf das Widerspruchsrecht des Mieters, korrekte Kündigungsfrist. Fehlt die Begründung, ist die Kündigung formal unwirksam.\n\nKündigungsfristen nach Mietdauer\nNach § 573c BGB gelten: bis 5 Jahre Mietdauer 3 Monate, 5 bis 8 Jahre 6 Monate, über 8 Jahre 9 Monate. Maßgeblich ist die Mietdauer zum Zeitpunkt des Zugangs der Kündigung.\n\nSperrfrist bei umgewandelten Eigentumswohnungen\nWird eine vermietete Wohnung in Eigentumswohnungen umgewandelt und verkauft, gilt nach § 577a BGB eine Sperrfrist von drei Jahren ab Grundbucheintragung des neuen Eigentümers, bevor Eigenbedarf geltend gemacht werden darf. In Gebieten mit angespanntem Wohnungsmarkt können Bundesländer diese Frist per Verordnung auf bis zu zehn Jahre verlängern.\n\nDas Widerspruchsrecht des Mieters (Sozialklausel)\nMieter können nach § 574 BGB widersprechen, wenn die Beendigung eine nicht zu rechtfertigende Härte bedeuten würde — etwa bei hohem Alter, schwerer Krankheit oder fehlendem angemessenem Ersatzwohnraum. Der Widerspruch muss spätestens zwei Monate vor Beendigung schriftlich erklärt werden.\n\nVorgetäuschter Eigenbedarf: Erhebliches Risiko für Vermieter\nZieht die Bedarfsperson nicht dauerhaft ein, spricht viel für vorgetäuschten Eigenbedarf. Der ehemalige Mieter kann Schadensersatz verlangen, der Umzugskosten, Mietdifferenz und Maklerkosten umfassen kann — in der Praxis werden hier schnell fünfstellige Summen erreicht.\n\nAlternative: Kündigung bei Hinderung wirtschaftlicher Verwertung\n§ 573 Abs. 2 Nr. 3 BGB erlaubt eine Kündigung, wenn der Vermieter durch Fortsetzung des Mietverhältnisses an angemessener wirtschaftlicher Verwertung gehindert wird, etwa bei geplantem Abriss und Neubau — in der Praxis seltener erfolgreich als die klassische Eigenbedarfskündigung.\n\nFazit\nEine Eigenbedarfskündigung ist rechtlich zulässig, aber formal streng geregelt: konkrete Begründung, korrekte Frist, Beachtung der Sperrfrist bei umgewandelten Eigentumswohnungen und Bewusstsein für das Härterisiko.",
