      "description": "Warum der monatliche Cashflow oft wichtiger ist als die Rendite auf dem Papier — mit Formel, Beispielrechnung und den häufigsten Fehlern bei der Kalkulation.",
      "articleBody": "Was ist Cashflow bei Immobilien?\nDer Cashflow ist der Betrag, der monatlich tatsächlich auf dem Konto ankommt, nachdem alle laufenden Kosten und die Finanzierungsrate von den Mieteinnahmen abgezogen wurden. Anders als die Mietrendite ist der Cashflow die konkrete, liquide Größe.\n\nCashflow berechnen: Die Formel\nCashflow = Kaltmiete − laufende Kosten − Finanzierungsrate (Zins + Tilgung). Beispiel: 900 € Kaltmiete, 150 € laufende Kosten, 620 € Kreditrate. Cashflow = 900 − 150 − 620 = 130 € im Monat. Zu unterscheiden sind Zins-Cashflow (nur Zinsen abgezogen, Tilgung zählt als Vermögensaufbau) und Voll-Cashflow (gesamte Kreditrate abgezogen) — für die reine Liquiditätsbetrachtung ist der Voll-Cashflow relevant.\n\nPositiver vs. negativer Cashflow\nEin positiver Cashflow bedeutet, dass die Immobilie sich selbst trägt und Überschuss abwirft. Ein negativer Cashflow bedeutet, dass monatlich Eigenkapital nachgeschossen werden muss — das ist nicht automatisch ein Fehler, wenn der Betrag dauerhaft tragbar ist. Faustregel: mindestens kostendeckend, idealerweise ein Sicherheitspuffer von 100–200 € pro Objekt.\n\nDie häufigsten Fehler bei der Cashflow-Kalkulation\nInstandhaltungsrücklage vergessen oder unterschätzen (bei älteren Gebäuden mindestens 1–1,50 €/m² monatlich einplanen), Leerstand nicht einkalkulieren (realistischer sind 11 bis 11,5 Monate Mieteinnahmen statt 12), nur die Zinsen statt der vollen Rate abziehen, Anschlussfinanzierung nach Ablauf der Zinsbindung ignorieren.\n\nCashflow vs. Rendite: Was ist wichtiger?\nDie Mietrendite zeigt, wie profitabel eine Immobilie im Verhältnis zum Kaufpreis ist, unabhängig von der Finanzierung. Der Cashflow zeigt, ob die konkrete Finanzierungsstruktur zu positiver oder negativer monatlicher Liquidität führt. Beide Kennzahlen sollten gemeinsam betrachtet werden.\n\nCashflow verbessern: Die wichtigsten Stellhebel\nTilgung strecken statt hohe Rate (senkt Cashflow-Belastung, verlängert Laufzeit), Sondertilgungen gezielt einsetzen, Nebenkosten korrekt und vollständig umlegen, Miete an die ortsübliche Vergleichsmiete anpassen.\n\nSteuerlicher Verlust ist nicht gleich Liquiditätsverlust\nEine Immobilie kann steuerlich einen Verlust ausweisen, obwohl der tatsächliche Cashflow positiv ist, weil die AfA eine reine Buchgröße ist. Umgekehrt kann eine Immobilie steuerlich profitabel aussehen, während der reale Cashflow negativ ist, etwa bei hoher Tilgung.\n\nCashflow im Portfolio\nWer mehrere Immobilien hält, sollte den Portfolio-Cashflow im Blick behalten, nicht nur den Cashflow jedes einzelnen Objekts.\n\nFazit\nDer Cashflow ist die Kennzahl, die im Alltag zählt: Sie entscheidet, ob eine Immobilie finanziell tragbar ist oder zur Belastung wird.",
