      "description": "Was ein Mietspiegel ist, wie er sich auf Mieterhöhungen auswirkt und welche Grenzen Kappungsgrenze und Mietpreisbremse setzen.",
      "articleBody": "Was ist ein Mietspiegel?\nDer Mietspiegel ist eine von Gemeinde oder Stadt erstellte Übersicht über die ortsübliche Vergleichsmiete — also die Nettokaltmiete, die in der jeweiligen Stadt für vergleichbare Wohnungen üblich ist, gestaffelt nach Wohnlage, Baujahr, Größe und Ausstattung. Er ist die zentrale Referenzgröße für Mieterhöhungen im laufenden Mietverhältnis und für die Mietpreisbremse bei Neuvermietungen.\n\nEinfacher vs. qualifizierter Mietspiegel\nDer einfache Mietspiegel wird von der Gemeinde erstellt oder anerkannt und dient als Orientierungshilfe. Vor Gericht ist er ein Indiz, aber kein zwingender Beweis. Der qualifizierte Mietspiegel (§ 558d BGB) wird nach anerkannten wissenschaftlichen Grundsätzen erstellt und von der Gemeinde als solcher anerkannt. Er wird vor Gericht als Beweis für die ortsübliche Vergleichsmiete vermutet — Mieterhöhungen, die sich darauf stützen, sind deutlich rechtssicherer.\nNicht jede Stadt hat einen qualifizierten Mietspiegel. Größere Städte wie Berlin, München, Hamburg oder Köln verfügen in der Regel über einen, kleinere Gemeinden oft nur über einen einfachen oder gar keinen.\n\nMieterhöhung nach Mietspiegel: Die Spielregeln\nEine Mieterhöhung auf die ortsübliche Vergleichsmiete ist frühestens 15 Monate nach der letzten Mieterhöhung oder dem Einzug zulässig, und die neue Miete darf erst nach einer weiteren Wartezeit von drei Monaten seit Zugang des Erhöhungsverlangens gezahlt werden.\nDie Kappungsgrenze: Die Miete darf innerhalb von drei Jahren um maximal 20 % steigen — in Gebieten mit angespanntem Wohnungsmarkt gilt eine verschärfte Kappungsgrenze von 15 %. Das gilt unabhängig davon, wie stark die ortsübliche Vergleichsmiete tatsächlich gestiegen ist. Beide Grenzen gelten parallel, es zählt jeweils der niedrigere Wert.\n\nMietpreisbremse bei Neuvermietung\nIn Gebieten mit angespanntem Wohnungsmarkt greift bei Neuvermietung die Mietpreisbremse (§ 556d BGB): Die vereinbarte Miete darf die ortsübliche Vergleichsmiete laut Mietspiegel um maximal 10 % übersteigen. Ausnahmen gelten unter anderem für umfassend modernisierte Wohnungen, Neubauten (Erstbezug nach dem 1. Oktober 2014) sowie wenn die Vormiete bereits über diesem Wert lag.\n\nWo finde ich den Mietspiegel meiner Stadt?\nQualifizierte und einfache Mietspiegel werden in der Regel von der jeweiligen Stadtverwaltung oder dem Bau-/Wohnungsamt veröffentlicht, oft kostenlos online abrufbar. Größere Städte aktualisieren ihren Mietspiegel meist alle zwei Jahre, dazwischen wird er mit dem Verbraucherpreisindex fortgeschrieben.\n\nPraxistipp: Mieterhöhung korrekt begründen\nEin Erhöhungsverlangen muss in Textform erfolgen und die Erhöhung nachvollziehbar begründen — üblicherweise durch Bezug auf die konkrete Einordnung der Wohnung im Mietspiegel. Pauschale Erhöhungen ohne Begründung sind unwirksam.\n\nFazit\nDer Mietspiegel ist die zentrale Referenz für rechtssichere Mieterhöhungen — aber nur in Kombination mit der Kappungsgrenze, den Wartefristen und einer sauberen Begründung.",
