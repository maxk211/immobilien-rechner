      "articleBody": "Warum die Finanzierung die Rendite stärker beeinflusst als der Kaufpreis\nZwei identische Immobilien mit demselben Kaufpreis und derselben Miete können völlig unterschiedliche Cashflows und Eigenkapitalrenditen liefern — abhängig von der Finanzierung.\n\nEigenkapitalquote: Wie viel Eigenkapital ist sinnvoll?\nBanken verlangen bei Kapitalanlage-Immobilien meist 20 bis 30 % des Kaufpreises als Eigenkapital, zuzüglich der vollständigen Kaufnebenkosten, die meist nicht mitfinanziert werden. Eine Vollfinanzierung ist möglich, aber mit Zinsaufschlägen und strengeren Bonitätsanforderungen verbunden.\n\nZinsbindung: Wie lange sollte der Zins fest sein?\nÜbliche Laufzeiten sind 5, 10, 15 oder 20 Jahre. Kurze Zinsbindung bedeutet niedrigeren Zinssatz, aber Zinsänderungsrisiko bei der Anschlussfinanzierung. Lange Zinsbindung bedeutet höheren Zinssatz, aber volle Planungssicherheit. 10 Jahre gilt als üblicher Mittelweg. Zur Einordnung: Im August 2026 liegen die Bauzinsen für eine 10-jährige Zinsbindung grob zwischen 3,6 % und 4,1 % effektiv, abhängig von Bonität und Beleihungsauslauf.\n\nTilgungssatz: Direkter Hebel für den Cashflow\nEin niedrigerer anfänglicher Tilgungssatz (z. B. 1 % statt 3 %) senkt die monatliche Rate und verbessert den Cashflow sofort, auf Kosten einer längeren Gesamtlaufzeit und höherer Zinskosten. Je niedriger die anfängliche Tilgung, desto höher das Zinsänderungsrisiko bei der Anschlussfinanzierung.\n\nBeleihungsauslauf und Beleihungswert\nDer Beleihungswert ist der von der Bank konservativ ermittelte Wert der Immobilie, oft unter dem Kaufpreis. Der Beleihungsauslauf beschreibt den Kreditbetrag im Verhältnis zum Beleihungswert. Über 60 % verlangen viele Banken einen Zinsaufschlag, über 80 % meist deutlich mehr.\n\nBereitstellungszinsen und Forward-Darlehen\nWird ein Kredit nicht sofort vollständig abgerufen, berechnen Banken nach einer meist kostenfreien Frist von 6 bis 12 Monaten Bereitstellungszinsen von etwa 0,25 % pro Monat auf den nicht abgerufenen Betrag. Mit einem Forward-Darlehen lässt sich der aktuelle Zinssatz für die Anschlussfinanzierung bis zu 5 Jahre im Voraus sichern, gegen einen mit der Vorlaufzeit steigenden Zinsaufschlag.\n\nSondertilgung und Flexibilität einplanen\nEin Sondertilgungsrecht (üblich 5 bis 10 % der Darlehenssumme pro Jahr kostenfrei) erlaubt es, bei Liquiditätsüberschuss die Restschuld zu senken. Für Investoren, die mehrere Immobilien nacheinander finanzieren wollen, ist es oft sinnvoller, freie Liquidität für das nächste Eigenkapital zurückzuhalten.\n\nFörderungen: KfW und regionale Programme\nFür energieeffiziente Neubauten oder Sanierungen bietet die KfW zinsvergünstigte Darlehen und teilweise Tilgungszuschüsse, an energetische Standards geknüpft, kombinierbar mit klassischer Bankfinanzierung.\n\nFazit\nBei der Immobilienfinanzierung entscheidet das Zusammenspiel aus Eigenkapitalquote, Zinsbindung, Tilgungssatz und Beleihungsauslauf über die Rendite — nicht nur der nominale Zinssatz.",
