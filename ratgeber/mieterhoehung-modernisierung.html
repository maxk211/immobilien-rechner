      "articleBody": "Modernisierung vs. Instandhaltung: Der entscheidende Unterschied\nNur Modernisierungsmaßnahmen berechtigen zur Mieterhöhung nach § 559 BGB. Eine Modernisierung verbessert den Gebrauchswert der Wohnung nachhaltig, spart Energie oder Wasser ein, oder passt die Wohnung dauerhaft an veränderte Wohnverhältnisse an. Reine Instandhaltung stellt lediglich den ursprünglichen Zustand wieder her und berechtigt nicht zur Umlage. Bei Mischmaßnahmen darf nur der modernisierende Mehraufwand umgelegt werden.\n\nDie 8-%-Umlage: So wird die neue Miete berechnet\nFormel: Jährliche Mieterhöhung = 8 % der aufgewendeten Modernisierungskosten (abzüglich Instandhaltungsanteil und Fördermittel). Beispiel: Eine energetische Fassadensanierung kostet 40.000 € für ein Haus mit vier gleich großen Wohnungen. Pro Wohnung entfallen 10.000 € Modernisierungskosten, 8 % davon sind 800 € pro Jahr — das entspricht 66,67 € mehr Miete im Monat. Erhaltene Fördermittel müssen von den umlagefähigen Kosten abgezogen werden.\n\nDie Kappungsgrenze: Deckel für die Mieterhöhung\nDie Miete darf durch Modernisierung innerhalb von sechs Jahren um maximal 3 €/m² Wohnfläche steigen. Lag die Miete vor der Modernisierung unter 7 €/m², gilt eine abgesenkte Kappungsgrenze von 2 €/m² innerhalb von sechs Jahren. Läge die rechnerische Umlage höher als die Kappungsgrenze zulässt, ist der übersteigende Teil dauerhaft ausgeschlossen.\n\nAnkündigungsfrist und Formvorschriften\nEine Modernisierung muss dem Mieter spätestens drei Monate vor Beginn in Textform angekündigt werden (§ 555c BGB), mit Angaben zu Art, Umfang, voraussichtlichem Beginn und Dauer sowie der zu erwartenden Mieterhöhung.\n\nDas Härteeinwand-Recht des Mieters\nMieter können der Modernisierung unter bestimmten Voraussetzungen widersprechen (§ 555d BGB) — etwa bei hohem Alter, Krankheit, Schwangerschaft oder finanzieller Härte. Bei energetischen Modernisierungen zur Einsparung von Endenergie ist der Härteeinwand gegen die Durchführung selbst ausgeschlossen, wirkt aber gegenüber der Mieterhöhung.\n\nModernisierungsumlage vs. Mieterhöhung nach Mietspiegel\nDie Mieterhöhung nach Mietspiegel (§ 558 BGB) passt die Bestandsmiete an die ortsübliche Vergleichsmiete an. Die Modernisierungsumlage nach § 559 BGB erlaubt eine Erhöhung über die ortsübliche Vergleichsmiete hinaus, weil tatsächlich ein höherer Wohnwert geschaffen wurde.\n\nHäufige Fehler bei der Modernisierungsumlage\nInstandhaltungsanteil nicht herausgerechnet, Kappungsgrenze bei mehreren Maßnahmen innerhalb von sechs Jahren übersehen (die Grenze gilt für die Summe aller Maßnahmen), Fördermittel nicht von den umlagefähigen Kosten abgezogen.\n\nFazit\nDie Modernisierungsumlage ist ein mächtiges Instrument, um Investitionen in Wohnqualität und Energieeffizienz über die Miete zu refinanzieren — aber nur bei sauberer Trennung von Instandhaltung und Modernisierung, korrekter Ankündigung und Einhaltung der Kappungsgrenze rechtssicher durchsetzbar.",
