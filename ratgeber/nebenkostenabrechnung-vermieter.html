      "@context": "https://schema.org",
      "@type": "Article",
      "headline": "Nebenkostenabrechnung für Vermieter: Der komplette Leitfaden",
      "description": "Umlagefähige Betriebskosten, richtiger Umlageschlüssel und die 12-Monats-Frist — was Vermieter bei der Nebenkostenabrechnung wissen müssen.",
      "articleBody": "Warum die Nebenkostenabrechnung für Vermieter wichtig ist\nDie Nebenkostenabrechnung (rechtlich korrekt: Betriebskostenabrechnung) ist die jährliche Abrechnung der umlagefähigen Betriebskosten einer Immobilie gegenüber den Mietern. Sie entscheidet direkt über den Cashflow: Wer Kosten übersieht, die eigentlich umlagefähig wären, trägt sie faktisch selbst. Wer die Frist verpasst, verliert den Nachzahlungsanspruch komplett — unabhängig davon, wie berechtigt die Forderung ist.\n\nUmlagefähige Betriebskosten: Was darf auf Mieter umgelegt werden?\nWelche Kosten umlagefähig sind, regelt die Betriebskostenverordnung (BetrKV), konkret der Katalog in § 2 BetrKV. Nur Kosten, die dort aufgeführt sind — und die im Mietvertrag als umlagefähig vereinbart wurden — dürfen abgerechnet werden.\nUmlagefähig sind unter anderem: Grundsteuer (wird vollständig auf Mieter umgelegt), Wasser & Abwasser (meist nach Verbrauch), Heizung & Warmwasser (mindestens 50–70 % nach Verbrauch gemäß Heizkostenverordnung), Müllabfuhr, Straßenreinigung und Gebäudereinigung, Gartenpflege, Hausmeister und Aufzug, Sach- und Haftpflichtversicherung des Gebäudes sowie die Kabel-/Breitband-Grundgebühr, falls vertraglich vereinbart.\nNicht umlagefähig sind Verwaltungskosten (Hausverwaltung, Buchhaltung), Instandhaltungsrücklage und Reparaturen, Bankgebühren und Finanzierungskosten sowie Kosten für Leerstand — den Anteil leerstehender Einheiten trägt der Vermieter selbst.\nEin häufiger Fehler ist, Verwaltungs- oder Instandhaltungskosten versehentlich in die Abrechnung zu mischen — das führt bei einem Widerspruch des Mieters schnell zur (teilweisen) Unwirksamkeit der Abrechnung.\n\nDer Umlageschlüssel: Wie werden Kosten verteilt?\nIst im Mietvertrag kein Umlageschlüssel vereinbart, gilt gesetzlich der Wohnflächenschlüssel (§ 556a BGB): Jede Einheit trägt Kosten im Verhältnis ihrer Wohnfläche zur Gesamtwohnfläche des Gebäudes. Der Verbrauchsschlüssel ist zwingend vorgeschrieben für Heizung und Warmwasser (mindestens 50 %), ansonsten frei vereinbar für Wasser oder Strom mit Zwischenzählern. Die Personenzahl wird häufig bei Müll- oder Wasserkosten genutzt, muss aber vertraglich vereinbart sein. Bei Eigentumswohnungen ist der Miteigentumsanteil (MEA) oft identisch mit dem Verteilerschlüssel der WEG-Abrechnung.\nBei Mehrfamilienhäusern mit Gewerbeeinheiten im Erdgeschoss (z. B. Ladenlokal) muss der erhöhte Verbrauch dieser Einheiten angemessen berücksichtigt werden — sonst drohen berechtigte Einwände der Wohnungsmieter.\n\nDie Abrechnungsfrist: Zwölf Monate — keine Ausnahme\nNach § 556 Abs. 3 BGB muss die Nebenkostenabrechnung dem Mieter spätestens zwölf Monate nach Ende des Abrechnungszeitraums zugehen. Bei einem Abrechnungszeitraum vom 1. Januar bis 31. Dezember 2025 muss die Abrechnung also spätestens am 31. Dezember 2026 beim Mieter angekommen sein. Verpasst der Vermieter diese Frist, verfällt der Anspruch auf eine Nachzahlung vollständig — es sei denn, der Vermieter hat die Verspätung nachweislich nicht zu vertreten. Guthaben des Mieters bleiben davon unberührt und müssen auch nach Fristablauf ausgezahlt werden.\n\nNachzahlung, Guthaben und Vorauszahlungsanpassung\nErgibt die Abrechnung eine Nachzahlung, ist diese in der Regel binnen 30 Tagen nach Zugang der Abrechnung fällig. Ergibt sich ein Guthaben für den Mieter, muss es zeitnah erstattet werden. In beiden Fällen kann der Vermieter die monatlichen Nebenkostenvorauszahlungen für die Zukunft anpassen.\n\nHäufige Fehler in der Praxis\nVorjahreswerte unreflektiert übernehmen: Energiepreise und kommunale Gebühren schwanken. Wer die Vorauszahlungen nicht regelmäßig anpasst, produziert entweder große Nachzahlungen oder zu hohe Vorauszahlungen.\nLeerstandskosten falsch umgelegt: Verbrauchsunabhängige Kosten werden anteilig auch auf leerstehende Einheiten berechnet — dieser Anteil verbleibt beim Vermieter.\nBelege nicht vollständig vorhalten: Mieter haben ein Recht auf Einsicht in die Abrechnungsbelege.\n\nFazit\nEine korrekte Nebenkostenabrechnung ist Pflicht und direkter Cashflow-Hebel zugleich: Nur was sauber, fristgerecht und mit dem richtigen Umlageschlüssel abgerechnet wird, kommt auch tatsächlich beim Vermieter an.",
