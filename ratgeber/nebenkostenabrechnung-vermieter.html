          "@type": "Question",
          "name": "Welche Kosten sind bei der Nebenkostenabrechnung umlagefähig?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Umlagefähig sind die in § 2 der Betriebskostenverordnung (BetrKV) aufgeführten Kosten, u. a. Grundsteuer, Wasser/Abwasser, Heizung, Müllabfuhr, Hausmeister und Gebäudeversicherung — nicht umlagefähig sind Verwaltungskosten und Instandhaltungsrücklage."
          }
        },
        {
          "@type": "Question",
          "name": "Welche Frist gilt für die Nebenkostenabrechnung?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Die Abrechnung muss dem Mieter spätestens zwölf Monate nach Ende des Abrechnungszeitraums zugehen (§ 556 Abs. 3 BGB). Nach Fristablauf verfällt der Anspruch auf Nachzahlung."
          }
        },
        {
          "@type": "Question",
          "name": "Welcher Umlageschlüssel gilt für die Nebenkostenabrechnung?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ohne anderslautende Vereinbarung im Mietvertrag gilt der Wohnflächenschlüssel. Für Heizung und Warmwasser ist gesetzlich ein Mindestanteil von 50–70 % nach Verbrauch vorgeschrieben."
          }
        },
        {
          "@type": "Question",
          "name": "Was passiert, wenn ich die Abrechnungsfrist verpasse?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Der Anspruch auf eine Nachzahlung verfällt vollständig, außer der Vermieter hat die Verspätung nachweislich nicht zu vertreten. Ein Guthaben des Mieters muss trotzdem ausgezahlt werden."
          }
        }
      ]
    }
