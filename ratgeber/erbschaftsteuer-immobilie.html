    <script type="application/ld+json">

      "@type": "Article",

      "articleBody": "Erbschaftsteuer und Schenkungsteuer: Dieselben Regeln, unterschiedlicher Anlass\nErbschaftsteuer und Schenkungsteuer folgen denselben Regeln bei Freibeträgen, Steuerklassen und Steuersätzen — nur der Anlass unterscheidet sich. Bei einer Immobilie ist die Bewertung entscheidend für die Höhe der Steuer.\n\nPersönliche Freibeträge nach Verwandtschaftsgrad\nNach § 16 ErbStG: Ehepartner und eingetragene Lebenspartner 500.000 €, Kinder je Elternteil 400.000 €, Enkel 200.000 €, Eltern und Großeltern bei Erbschaft 100.000 €, alle übrigen Personen 20.000 €. Die Freibeträge gelten pro Person und pro Schenker bzw. Erblasser und leben alle zehn Jahre neu auf. Zusätzlich steht Ehepartnern nach § 17 ErbStG ein Versorgungsfreibetrag von bis zu 256.000 € zu, gekürzt um Versorgungsbezüge.\n\nSteuerklassen und Steuersätze\nDer Steuersatz hängt vom Verwandtschaftsgrad (Steuerklasse I, II, III) und der Höhe des steuerpflichtigen Erwerbs ab und reicht progressiv von 7 % bis 50 %. Beispiel: Ein Kind erbt eine vermietete Immobilie im Steuerwert von 550.000 € ohne weiteres Vermögen. Nach Abzug des Freibetrags von 400.000 € verbleiben 150.000 € steuerpflichtig, in Steuerklasse I entspricht das 11 % — 16.500 € Erbschaftsteuer.\n\nWie wird eine Immobilie für die Erbschaftsteuer bewertet?\nDas Finanzamt ermittelt den Wert nach dem Bedarfswertverfahren: Vergleichswertverfahren für Eigentumswohnungen und Einfamilienhäuser, Ertragswertverfahren für vermietete Mehrfamilienhäuser, Sachwertverfahren für Sonderfälle. Für zu Wohnzwecken vermietete bebaute Grundstücke gewährt § 13d ErbStG einen pauschalen Abschlag von 10 % auf den Steuerwert.\n\nSteuerbefreiung für das selbst genutzte Familienheim\nErbt der Ehepartner eine selbst genutzte Immobilie und nutzt sie unverzüglich mindestens zehn weitere Jahre selbst, bleibt der Erwerb vollständig steuerfrei, unabhängig vom Wert. Für Kinder gilt dieselbe Befreiung, begrenzt auf 200 m² Wohnfläche. Wird die Selbstnutzung ohne zwingenden Grund vor Ablauf der Zehnjahresfrist aufgegeben, entfällt die Befreiung rückwirkend.\n\nSchenkung zu Lebzeiten: Vorteile gegenüber dem Erbfall\nEine frühzeitige Schenkung erlaubt es, Freibeträge mehrfach im 10-Jahres-Rhythmus zu nutzen. Bei Schenkungen kann zusätzlich ein Nießbrauch- oder Wohnrecht für den Schenker vereinbart werden, das den steuerlichen Wert der Schenkung mindert.\n\nHäufige Fehler bei der Nachlassplanung mit Immobilien\nFreibeträge nicht rechtzeitig genutzt, Bewertungsverfahren nicht geprüft (ein niedrigerer tatsächlicher Verkehrswert kann per Gutachten nach § 198 BewG nachgewiesen werden), Zehnjahresfrist beim Familienheim übersehen.\n\nFazit\nBei Immobilienvermögen entscheidet häufig die Planung über die tatsächliche Steuerlast: rechtzeitige Schenkungen im 10-Jahres-Rhythmus, korrekte Bewertung inklusive 10-%-Abschlag für vermietete Objekte und gezielte Nutzung der Familienheim-Befreiung.",
