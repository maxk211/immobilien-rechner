      "description": "Wer eine vermietete Immobilie innerhalb von zehn Jahren nach dem Kauf verkauft, zahlt auf den Gewinn Einkommensteuer — mit Ausnahmen bei Eigennutzung.",
      "articleBody": "Was ist die Spekulationssteuer?\nDie umgangssprachlich als Spekulationssteuer bezeichnete Steuer ist rechtlich gesehen keine eigene Steuerart, sondern die Besteuerung eines privaten Veräußerungsgeschäfts nach § 23 EStG. Verkauft ein Vermieter eine Immobilie mit Gewinn innerhalb bestimmter Fristen nach dem Kauf, muss dieser Gewinn als Einkommen versteuert werden.\n\nDie 10-Jahres-Frist\nBei vermieteten Immobilien beträgt die Spekulationsfrist zehn Jahre. Maßgeblich ist das Datum des notariellen Kaufvertrags, sowohl beim Ankauf als auch beim Verkauf. Wird die Immobilie erst nach Ablauf dieser zehn Jahre verkauft, ist der Gewinn vollständig steuerfrei, unabhängig von der Höhe. Beispiel: Kaufvertrag am 15. März 2016 unterschrieben, Verkauf frühestens ab dem 16. März 2026 steuerfrei möglich.\n\nDie Ausnahme: Eigennutzung\nUnabhängig von der 10-Jahres-Frist bleibt der Verkauf steuerfrei, wenn die Immobilie im Verkaufsjahr und den beiden vorangegangenen Kalenderjahren durchgehend zu eigenen Wohnzwecken genutzt wurde, oder im gesamten Zeitraum zwischen Anschaffung und Veräußerung ausschließlich zu eigenen Wohnzwecken genutzt wurde. Die zwei vorangegangenen Kalenderjahre müssen nicht volle Kalenderjahre sein — es reicht ein zusammenhängender Nutzungszeitraum über drei Kalenderjahre.\n\nWie wird der Veräußerungsgewinn berechnet?\nVeräußerungsgewinn = Verkaufspreis − Anschaffungskosten − Veräußerungskosten + in Anspruch genommene AfA. Die in den Vorjahren geltend gemachte AfA erhöht den steuerpflichtigen Gewinn, weil sie den Buchwert der Immobilie mindert. Beispiel: Kaufpreis 2016: 250.000 €, AfA über 9 Jahre à 2 % auf 200.000 € Gebäudeanteil = 36.000 € kumulierte AfA, Verkaufspreis 2026: 320.000 €, Veräußerungskosten 12.000 €. Veräußerungsgewinn = 320.000 − 250.000 − 12.000 + 36.000 = 94.000 €.\n\nWie hoch ist die Steuer auf den Veräußerungsgewinn?\nAnders als bei Aktien gibt es keinen pauschalen Abgeltungssteuersatz von 25 % — der Veräußerungsgewinn wird dem übrigen zu versteuernden Einkommen hinzugerechnet und mit dem persönlichen Einkommensteuersatz (bis zu 45 % zzgl. Solidaritätszuschlag) versteuert.\n\nFreigrenze und Verlustverrechnung\nSeit 2024 gilt eine Freigrenze von 1.000 € pro Person und Jahr für den Gesamtgewinn aus allen privaten Veräußerungsgeschäften eines Jahres (§ 23 Abs. 3 EStG) — eine Freigrenze, kein Freibetrag: Liegt der Gesamtgewinn auch nur einen Euro darüber, ist der gesamte Betrag steuerpflichtig. Verluste können ausschließlich mit Gewinnen aus anderen privaten Veräußerungsgeschäften verrechnet werden.\n\nFazit\nWer den Verkauf einer vermieteten Immobilie plant, sollte das exakte Datum des ursprünglichen Kaufvertrags kennen und die 10-Jahres-Frist im Kalender markieren.",
