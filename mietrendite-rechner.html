            "@type": "Answer",

          }
        },

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kaufnebenkosten entstehen zusätzlich zum Kaufpreis: Grunderwerbsteuer (3,5–6,5 % je nach Bundesland), Notarkosten (ca. 1,5 %) und ggf. Maklerprovision (bis 3,57 %). In Deutschland liegen die Gesamtnebenkosten typischerweise zwischen 8 und 12 % des Kaufpreises."
