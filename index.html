    <!-- Strukturierte Daten: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Wie berechne ich die Mietrendite mit renditly?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Du gibst Kaufpreis, Kaufnebenkosten, Kaltmiete und laufende Kosten ein — renditly berechnet sofort Bruttomietrendite, Nettomietrendite und Cash-on-Cash-Rendite. Alle Werte werden automatisch aktualisiert wenn sich Miete oder Kosten ändern."
          }
        },
        {
          "@type": "Question",
          "name": "Was ist ein guter Cashflow bei Immobilien?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Als Faustregel gilt: ein positiver monatlicher Cashflow nach allen Kosten (Rate, Instandhaltung, Verwaltung, Hausgeld) ist das Ziel. renditly zeigt dir den Cashflow monatsgenau — inklusive 25-Jahres-Prognose mit Anschlussfinanzierung."
          }
        },
        {
          "@type": "Question",
          "name": "Kann ich renditly kostenlos testen?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ja — du kannst renditly 90 Tage kostenlos mit einer Immobilie testen, ohne Kreditkarte. Du bekommst Zugang zu allen Features: Cashflow-Analyse, Steuervorbereitung, Mieterverwaltung und mehr."
          }
        },
        {
          "@type": "Question",
          "name": "Für wen ist renditly geeignet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "renditly richtet sich an deutsche Vermieter und Immobilien-Investoren — vom Einsteiger mit einer Eigentumswohnung bis zum Profi mit mehreren Mehrfamilienhäusern. Der Starter-Plan eignet sich für 1 Objekt, Standard für bis zu 10 Immobilien, Pro für unlimitierte Portfolios."
          }
        },
        {
          "@type": "Question",
          "name": "Welche Steuer-Daten kann renditly exportieren?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "renditly exportiert alle steuerlich relevanten Posten als Excel und PDF: Mieteinnahmen, Schuldzinsen, Instandhaltung, Hausgeld, Verwaltungskosten, Fahrtkosten nach km-Pauschale und Erhaltungsaufwand. AfA-Daten werden als Grundlage für den Steuerberater mitgeliefert."
          }
        },
        {
          "@type": "Question",
          "name": "Kann jemand mein Vermögen oder meine Immobilien sehen?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nein — absolut nicht. Jeder Account ist vollständig isoliert. Weder andere Nutzer noch wir als Betreiber können sehen, welche Immobilien du hast, was sie wert sind oder wie dein Cashflow aussieht. Die Datenbank erzwingt das technisch über Row Level Security."
          }
        },
        {
          "@type": "Question",
          "name": "Sind meine Finanzdaten bei renditly sicher?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ja. Alle Daten liegen verschlüsselt auf Servern in der EU (PostgreSQL via Supabase). Die Verbindung ist immer TLS-verschlüsselt. Deine Daten werden nicht verkauft oder für Werbung genutzt."
          }
        },
        {
          "@type": "Question",
          "name": "Gibt es eine mobile App für renditly?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Die Web-App ist vollständig mobiloptimiert und funktioniert auf iPhone und Android wie eine native App — ohne Download aus dem App Store."
          }
        }
      ]
