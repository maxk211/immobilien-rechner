          "@type": "Question",
          "name": "Wie berechne ich die AfA für eine Immobilie?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Die AfA berechnet sich als Gebäudeanteil der Anschaffungskosten (Kaufpreis inkl. Nebenkosten, ohne Grundstücksanteil) multipliziert mit dem gesetzlichen AfA-Satz. Formel: Gebäudewert × AfA-Satz."
          }
        },
        {
          "@type": "Question",
          "name": "Wie hoch ist der AfA-Satz 2026?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "3 % pro Jahr für Neubauten ab Fertigstellung 2023, 2 % pro Jahr für Gebäude ab Baujahr 1925, und 2,5 % pro Jahr für Altbauten vor 1925 gemäß § 7 Abs. 4 EStG."
          }
        },
        {
          "@type": "Question",
          "name": "Was ist der Grundstücksanteil bei der AfA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Der Grundstücksanteil ist der Anteil des Kaufpreises, der auf Grund und Boden entfällt — dieser ist nicht abschreibbar, da sich Grundstücke nicht abnutzen. Er liegt typischerweise zwischen 15 und 30 % je nach Lage und Bodenrichtwert."
          }
        },
        {
          "@type": "Question",
          "name": "Was ist die Sonder-AfA nach § 7b EStG?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Für neu gebaute Mietwohnungen mit Bauantrag seit 2023 gibt es zusätzlich zur linearen AfA eine Sonder-AfA von 5 % pro Jahr über die ersten 4 Jahre, sofern bestimmte Kosten- und Effizienzgrenzen eingehalten werden."
          }
        }
      ]
    }
    </script>
