    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "DefinedTermSet",
      "name": "Immobilien-Lexikon für Vermieter",
      "description": "29 zentrale Begriffe rund um Mietrendite, Steuern, Mietrecht und Finanzierung für deutsche Vermieter — kurz erklärt, mit Verweis auf vertiefende Ratgeber und Rechner.",
      "url": "https://www.renditly.de/immobilien-lexikon",
      "inLanguage": "de-DE",
      "hasDefinedTerm": [
        {
          "@type": "DefinedTerm",
          "name": "AfA (Absetzung für Abnutzung)",
          "description": "Die steuerliche Abschreibung des Gebäudewerts einer vermieteten Immobilie über die Nutzungsdauer. Mindert jährlich das zu versteuernde Einkommen aus Vermietung und Verpachtung, typisch 2 bis 3 % pro Jahr je nach Baujahr.",
          "url": "https://www.renditly.de/immobilien-lexikon#afa-absetzung-f-r-abnutzung-"
        },
        {
          "@type": "DefinedTerm",
          "name": "Annuitätendarlehen",
          "description": "Darlehensform mit über die Zinsbindung konstanter monatlicher Rate. Der Zinsanteil sinkt mit fallender Restschuld, der Tilgungsanteil steigt entsprechend.",
          "url": "https://www.renditly.de/immobilien-lexikon#annuit-tendarlehen"
        },
        {
          "@type": "DefinedTerm",
          "name": "Anschlussfinanzierung",
          "description": "Neue Finanzierung der nach Ablauf der Zinsbindung verbleibenden Restschuld, zu den dann aktuellen Marktkonditionen — diese können höher oder niedriger als der ursprüngliche Zins ausfallen.",
          "url": "https://www.renditly.de/immobilien-lexikon#anschlussfinanzierung"
        },
        {
          "@type": "DefinedTerm",
          "name": "Beleihungsauslauf",
          "description": "Verhältnis der Darlehenssumme zum Beleihungswert der Immobilie, angegeben in Prozent. Ein niedrigerer Beleihungsauslauf führt in der Regel zu besseren Kreditkonditionen.",
          "url": "https://www.renditly.de/immobilien-lexikon#beleihungsauslauf"
        },
        {
          "@type": "DefinedTerm",
          "name": "Bestellerprinzip",
          "description": "Regel bei der Vermietung (nicht beim Kauf): Wer den Makler beauftragt, muss ihn auch bezahlen — meist also der Vermieter. Gilt seit 2015 für Mietverträge in Deutschland.",
          "url": "https://www.renditly.de/immobilien-lexikon#bestellerprinzip"
        },
        {
          "@type": "DefinedTerm",
          "name": "Betriebskostenverordnung (BetrKV)",
          "description": "Verordnung, die abschließend festlegt, welche Kostenarten als Betriebskosten auf Mieter umgelegt werden dürfen — etwa Grundsteuer, Versicherungen, Hausmeister und Müllabfuhr.",
          "url": "https://www.renditly.de/immobilien-lexikon#betriebskostenverordnung-betrkv-"
        },
        {
          "@type": "DefinedTerm",
          "name": "Bruttomietrendite",
          "description": "Die jährliche Kaltmiete geteilt durch den Kaufpreis der Immobilie, ohne Berücksichtigung von Kaufnebenkosten oder laufenden Kosten. Dient als schneller, aber grober erster Vergleichswert zwischen Objekten.",
          "url": "https://www.renditly.de/immobilien-lexikon#bruttomietrendite"
        },
        {
          "@type": "DefinedTerm",
          "name": "Cash-on-Cash-Rendite",
          "description": "Der jährliche Cashflow nach Finanzierungskosten geteilt durch das eingesetzte Eigenkapital. Zeigt, wie effizient das eigene Kapital arbeitet, insbesondere bei fremdfinanzierten Objekten.",
          "url": "https://www.renditly.de/immobilien-lexikon#cash-on-cash-rendite"
        },
        {
          "@type": "DefinedTerm",
          "name": "Cashflow",
          "description": "Die monatliche Differenz zwischen Mieteinnahmen und allen laufenden Ausgaben (Finanzierungsrate, Bewirtschaftungskosten, Rücklagen). Ein positiver Cashflow bedeutet, die Immobilie trägt sich selbst.",
          "url": "https://www.renditly.de/immobilien-lexikon#cashflow"
        },
        {
          "@type": "DefinedTerm",
          "name": "Eigenbedarfskündigung",
          "description": "Kündigungsgrund nach § 573 BGB, wenn der Vermieter die Wohnung für sich selbst oder nahe Angehörige benötigt. Erfordert eine konkrete, nachvollziehbare Begründung und die Einhaltung gestaffelter Kündigungsfristen.",
          "url": "https://www.renditly.de/immobilien-lexikon#eigenbedarfsk-ndigung"
        },
        {
          "@type": "DefinedTerm",
          "name": "Erbschaftsteuer bei Immobilien",
          "description": "Steuer auf den Erwerb einer Immobilie durch Erbschaft oder Schenkung, mit Freibeträgen von 20.000 bis 500.000 € je nach Verwandtschaftsgrad und einem 10-%-Abschlag für vermietete Objekte.",
          "url": "https://www.renditly.de/immobilien-lexikon#erbschaftsteuer-bei-immobilien"
        },
        {
          "@type": "DefinedTerm",
          "name": "Gebäudemodernisierungsgesetz (GModG)",
          "description": "Löst seit Juli 2026 das bisherige Gebäudeenergiegesetz (GEG) ab und ersetzt die starre 65-Prozent-Erneuerbare-Pflicht bei neuen Heizungen durch einen technologieoffeneren Rahmen.",
          "url": "https://www.renditly.de/immobilien-lexikon#geb-udemodernisierungsgesetz-gmodg-"
        },
        {
          "@type": "DefinedTerm",
          "name": "Grunderwerbsteuer",
          "description": "Einmalige Steuer beim Eigentumswechsel einer Immobilie, die vom jeweiligen Bundesland festgelegt wird. Die Sätze reichen aktuell von 3,5 % in Bayern bis 6,5 % in mehreren Bundesländern.",
          "url": "https://www.renditly.de/immobilien-lexikon#grunderwerbsteuer"
        },
        {
          "@type": "DefinedTerm",
          "name": "Grundsteuer",
          "description": "Jährlich wiederkehrende kommunale Steuer auf Grundbesitz, berechnet aus Grundsteuerwert, Steuermesszahl und dem Hebesatz der Gemeinde. Seit der Reform 2025 gilt bundesweit ein neues Bewertungsrecht.",
          "url": "https://www.renditly.de/immobilien-lexikon#grundsteuer"
        },
        {
          "@type": "DefinedTerm",
          "name": "Grundstücksanteil",
          "description": "Der Teil des Kaufpreises, der auf Grund und Boden entfällt und nicht abschreibbar ist, da sich Grundstücke nicht abnutzen — typischerweise 15 bis 30 % je nach Lage und Bodenrichtwert.",
          "url": "https://www.renditly.de/immobilien-lexikon#grundst-cksanteil"
        },
        {
          "@type": "DefinedTerm",
          "name": "Kappungsgrenze",
          "description": "Begrenzt die Mieterhöhung auf die ortsübliche Vergleichsmiete: maximal 20 % innerhalb von drei Jahren, in Gebieten mit angespanntem Wohnungsmarkt maximal 15 %.",
          "url": "https://www.renditly.de/immobilien-lexikon#kappungsgrenze"
        },
        {
          "@type": "DefinedTerm",
          "name": "Kaufnebenkosten",
          "description": "Zusatzkosten beim Immobilienerwerb neben dem Kaufpreis — vor allem Grunderwerbsteuer, Notar- und Grundbuchkosten sowie ggf. Maklerprovision. Liegen in Deutschland meist bei 8 bis 15 % des Kaufpreises.",
          "url": "https://www.renditly.de/immobilien-lexikon#kaufnebenkosten"
        },
        {
          "@type": "DefinedTerm",
          "name": "Maklerprovision (Halbteilungsgrundsatz)",
          "description": "Beim Immobilienkauf gilt seit 2020 der Halbteilungsgrundsatz nach § 656c BGB: Ist der Makler für beide Seiten tätig, wird die Provision hälftig zwischen Käufer und Verkäufer geteilt.",
          "url": "https://www.renditly.de/immobilien-lexikon#maklerprovision-halbteilungsgrundsatz-"
        },
        {
          "@type": "DefinedTerm",
          "name": "Mietkaution",
          "description": "Sicherheitsleistung des Mieters von maximal drei Nettokaltmieten, die der Vermieter getrennt vom eigenen Vermögen und verzinst anlegen muss (§ 551 BGB).",
          "url": "https://www.renditly.de/immobilien-lexikon#mietkaution"
        },
        {
          "@type": "DefinedTerm",
          "name": "Mietpreisbremse",
          "description": "Begrenzt in ausgewiesenen Gebieten mit angespanntem Wohnungsmarkt die Miete bei Neuvermietung auf maximal 10 % über der ortsüblichen Vergleichsmiete, mit gesetzlichen Ausnahmen etwa für Neubauten.",
          "url": "https://www.renditly.de/immobilien-lexikon#mietpreisbremse"
        },
        {
          "@type": "DefinedTerm",
          "name": "Mietspiegel",
          "description": "Übersicht über die ortsübliche Vergleichsmiete einer Gemeinde, gegliedert nach Wohnungsgröße, Lage, Ausstattung und Baujahr. Zentrale Grundlage für rechtssichere Mieterhöhungen.",
          "url": "https://www.renditly.de/immobilien-lexikon#mietspiegel"
        },
        {
          "@type": "DefinedTerm",
          "name": "Modernisierungsumlage (§ 559 BGB)",
          "description": "Erlaubt Vermietern, 8 % der Modernisierungskosten jährlich auf die Miete umzulegen, begrenzt durch eine Kappungsgrenze von 3 €/m² in sechs Jahren. Für Heizungstausch gilt seit 2024 eine Sonderregel mit 10 %.",
          "url": "https://www.renditly.de/immobilien-lexikon#modernisierungsumlage-559-bgb-"
        },
        {
          "@type": "DefinedTerm",
          "name": "Nebenkostenabrechnung",
          "description": "Die jährliche Abrechnung der umlagefähigen Betriebskosten zwischen Vermieter und Mieter, die dem Mieter spätestens 12 Monate nach Ende des Abrechnungszeitraums zugehen muss.",
          "url": "https://www.renditly.de/immobilien-lexikon#nebenkostenabrechnung"
        },
        {
          "@type": "DefinedTerm",
          "name": "Nettomietrendite",
          "description": "Die Jahreskaltmiete abzüglich nicht umlagefähiger Bewirtschaftungskosten, geteilt durch den Kaufpreis inklusive Kaufnebenkosten. Deutlich aussagekräftiger als die Bruttomietrendite, da sie die tatsächliche Kostenstruktur berücksichtigt.",
          "url": "https://www.renditly.de/immobilien-lexikon#nettomietrendite"
        },
        {
          "@type": "DefinedTerm",
          "name": "Sonder-AfA § 7b EStG",
          "description": "Zusätzliche Abschreibung von 5 % pro Jahr über die ersten vier Jahre für neu gebaute Mietwohnungen mit Bauantrag ab 2023, sofern bestimmte Kosten- und Effizienzgrenzen eingehalten werden.",
          "url": "https://www.renditly.de/immobilien-lexikon#sonder-afa-7b-estg"
        },
        {
          "@type": "DefinedTerm",
          "name": "Spekulationssteuer",
          "description": "Umgangssprachlicher Begriff für die Besteuerung des Veräußerungsgewinns bei einem Immobilienverkauf innerhalb von 10 Jahren nach Anschaffung (§ 23 EStG). Bei durchgehender Eigennutzung entfällt sie.",
          "url": "https://www.renditly.de/immobilien-lexikon#spekulationssteuer"
        },
        {
          "@type": "DefinedTerm",
          "name": "Tilgungssatz",
          "description": "Prozentualer Anteil der Darlehenssumme, der anfänglich jährlich zurückgezahlt wird — üblich sind 1 bis 3 % pro Jahr. Ein höherer Tilgungssatz verkürzt die Kreditlaufzeit erheblich.",
          "url": "https://www.renditly.de/immobilien-lexikon#tilgungssatz"
        },
        {
          "@type": "DefinedTerm",
          "name": "Untervermietung",
          "description": "Überlassung eines Teils der Mietwohnung an Dritte, für die der Mieter grundsätzlich die Erlaubnis des Vermieters benötigt. Bei berechtigtem Interesse besteht ein gesetzlicher Anspruch darauf (§ 553 BGB).",
          "url": "https://www.renditly.de/immobilien-lexikon#untervermietung"
        },
        {
          "@type": "DefinedTerm",
          "name": "Zinsbindung",
          "description": "Zeitraum, für den der vereinbarte Sollzins eines Immobiliendarlehens festgeschrieben ist, häufig 10, 15 oder 20 Jahre. Nach Ablauf wird für die Restschuld eine Anschlussfinanzierung benötigt.",
          "url": "https://www.renditly.de/immobilien-lexikon#zinsbindung"
        }
      ]
    }
    </script>
